[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
version         = ""
requires-python = ">=3.8"
name            = "aboutmeta"
description     = ''
readme          = "README.md"
authors         = [
  { name = "Christophe BAL", email = "projetmbc@gmail.com" },
]

license = "GPL-3.0-or-later"

keywords = [
  "metada",
  "project",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = []

[project.urls]
Documentation = "https://github.com/bc-tools/for-dev/tree/main/@-bout-meta#readme"
Issues        = "https://github.com/bc-tools/for-dev/tree/main/@-bout-meta/issues"
Source        = "https://github.com/bc-tools/for-dev/tree/main/@-bout-meta"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/aboutmeta tests}"

[tool.coverage.run]
source_pkgs = [
  "aboutmeta",
  "tests"
]
branch   = true
parallel = true
# omit     = []

[tool.coverage.paths]
aboutmeta = [
  "src/aboutmeta",
  "*/aboutmeta/src/aboutmeta"
]
tests = [
  "tests",
  "*/aboutmeta/tests"
s]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build]
sources = ["src"]

[tool.hatch.envs.debug]
dependencies = []
