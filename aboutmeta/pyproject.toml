# Launching test :
# hatch run test:run tests/

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
dynamic         = ["version"]
name            = "aboutmeta"
description     = ''
readme          = "README.md"
authors         = [
  { name = "Christophe BAL", email = "projetmbc@gmail.com" },
]

requires-python = ">=3.12"

license = "GPL-3.0-only"

keywords = [
  "metada",
  "project",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [ # Nettoyer via prune et minimser la liste : attendre unit tests
  "email_validator>=2.2",
  "httpx>=0.28.1",
  "langcodes>=3.5",
  "language_data>=1.4",
  "natsort>=8.4",
  "python-benedict>=0.40.1",
  "pyyaml>=6.0",
  "rapidfuzz>=3.13",
  "requests>=2.32",
  "rich>=13.9",
  "semver>=3.0",
  "typer>=0.16",
]

[project.urls]
Documentation = "https://github.com/bc-tools/for-dev/tree/main/aboutmeta#readme"
Issues        = "https://github.com/bc-tools/for-dev/tree/main/aboutmeta/issues"
Source        = "https://github.com/bc-tools/for-dev/tree/main/aboutmeta"

[tool.hatch.version]
path    = "about.yaml"
pattern = 'version:\s*"(?P<version>.*)"'

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/}"
html  = "mypy --install-types --non-interactive --html-report htmlmypy {args:src/}"

[tool.coverage.run]
source_pkgs = [
  "aboutmeta",
]
branch   = true
parallel = true
# omit     = []

[tool.coverage.paths]
aboutmeta = [
  "src/aboutmeta",
  "*/aboutmeta/src/aboutmeta"
]
tests = [
  "tests",
  "*/aboutmeta/tests"
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build]
sources = ["src"]
include = []

[tool.hatch.envs.debug]
dependencies = [
  "pytest>=8.4",
  "hypothesis>=6.170",
]

[tool.hatch.envs.test]
dependencies = [
  "pytest>=8.4",
  "hypothesis>=6.170",
  "pytest-cov>=4.0",
]

[tool.hatch.envs.test.scripts]
run = "pytest {args}"
cov = "pytest --cov-report=term-missing --cov=aboutmeta {args}"
html = "pytest --cov-report=html --cov=aboutmeta {args}"
