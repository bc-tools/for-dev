###
# This block allows to work with relatively specified file paths,
# optionally using ''glob'' or ''regex'' search patterns.
###


###
# Using hard-coded paths, or ''glob'' or ''regex'' patterns, you
# select a list of relative paths of existing files. Here are the
# available features, with paths searched inside the folder of
# the ''about.yaml'' file.
#
#   + ''hard/coded/path/one/file.ext'' indicates a specific file.
#
#   + ''hard/coded/path/about/subfolder/'' indicates a specific
#     folder containing a new ''about.yaml'' file to be analyzed.
#
#   + ''glob: ...'' allows to use the glob syntax, and for a
#     recursive search, there is ''r-glob: ...''.
#
#   + ''regex: ...'' allows to use regex patterns, and
#     ''r-regex: ...'' is available for recursive searches.
###
- virtual_path+
