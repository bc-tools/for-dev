###
# This block allows to describe a numerical project from a technical
# point of view.
#
#
# Here is a fictitious example identifying a code project (the case
# of a document-type project is similar)."
#
# yaml::
#     project:
#       version: 0.0.0-beta.1
#       date   : 2025-06-27
#
#       acronym : "[@]bout [Desc]ription"
#       codename: a_desc
#       desc    : The project ''@Desc'' is...
#
#       authors:
#         - Ada, Lovelace  [ada.babbage.computer@paper.org]
#           (Victorian Applied Mechanical Informatic Institute)
#         - Jean, Louis, Krivine  [jl-krivine@compile.brain]
#         - Torvalds
#           (Sacred Kernels Department)
#         - William, Justme
#
#       contribs:
#         - Alan, Turing  [alan.turing@enigma.uk]
#           (Institut de Cryptographie Avancée)
#         - Donald, Knuth  [donald.knuth@texmath.net]
#           (University of TeX-as Typography)
#
#       urls:
#         home  : https://github.com/bc-tools/for-dev
#         dev   : https://github.com/bc-tools/for-dev/tree/main/aboutmeta
#         issues: https://github.com/bc-tools/for-dev/issues
#
#       licenses:
#         code  : gpl 3.0+
#         manual: cc by nc 4.0
#
#       langs:
#         doc   : fr
#         manual: fr
#
#       require:
#         - python3
#         - latex
#
#       keywords:
#         - metadata
#         - coding
#         - writing
#
#
# note::
#     For a document-type project, the ''project.codename'' key is
#     no longer usable and must be replaced by ''project.doctitle''
#     (a document must have a title). By default, the project is
#     considered a code project.
###


###
# XXX
###
version *: sem_version

###
# XXX
###
date *: date

###
# XXX
###
acronym *: acronym


###
# [[doctitle]]
# This key must be used for a document-type project. This is because
# such a project must have a title.
#
#
# [[codename]]
# This key allows you to specify the name of a code-type project if
# it differs from that of the project folder.
#
#
# note::
#     If neither the ''codename'' nor ''doctitle'' key is used, the
#     project will be considered to be of code type.
###
codename | doctitle *: str +


###
# This key must be used to quickly describe the project.
###
desc:
  .


###
# [[authors]]
# This block allows to indicate several authors, just by using a
# ''YAML'' list of single ''author'' values. The following section
# describes how to use a single ''author'' key.
#
#
# [[author]]
# The key ''author'' is for identifing a single author using one of
# the following possible syntaxes.
###
author | authors *: person | list(.)


###
# The ''contribs'' and ''contrib'' key follow the same syntax as
# ''authors'' and ''author'', except they indicate contributors
# instead.
###
contrib | contribs *: . | list(.)


###
# This block allows to provide hyperlinks via the following keys, all
# of which are optional.
#
#   1. ''home'' allows to specify the address of a website dedicated
#      to the project.
#
#   1. ''dev'' is used to point to a repository for managing project
#      development.
#
#   1. ''issues'' redirects users to the page where they can report
#      bugs or make suggestions.
#
#
# Here is an example.
#
# yaml::
#     urls:
#       home  : https://github.com/bc-tools/for-dev
#       dev   : https://github.com/bc-tools/for-dev/tree/main/aboutmeta
#       issues: https://github.com/bc-tools/for-dev/issues
###
urls *:
  home, dev, issues *: url


###
# This block serves to give a license (which is a best practice).
# You can used the folowing keys.
#
#     1. ''code'' is for the project license.
#
#     1. ''manual'' allows, in the case of a code-type project, the
#        selection of a specific user manual license.
#
#
# Here is a fictitious example.
#
# yaml::
#     licenses:
#       code  : gpl 3.0+
#       manual: cc by nc 4.0
###
licenses *:
  code, manual *: license


###
# This block allows to specify the languages used for the following
# parts of a code-type project.
#
#     1. The ''doc'' key is for the documentation language.
#
#     1. The ''manual'' key is for the user manual language.
#
#
# Here is a fictitious example.
#
# yaml::
#     langs:
#       doc   : fr
#       manual: fr
###
langs *:
  doc, manual *: lang


###
# This block allows to provide a list of programming languages
# required for the code to work, or for compiling a document, this
# depends on the type of project.
#
#
# Here is a fictitious example.
#
# yaml::
#     require:
#       - python3
#       - latex
###
require *:
  - str


###
# This block allows to specify a list of keywords that succinctly
# categorize the project type.
#
#
# Here is a fictitious example.
#
# yaml::
#     keywords:
#       - metadata
#       - coding
#       - writing
###
keywords *:
  - .
