###
# Using hard-coded paths, or glob or regex patterns, you select a list
# of absolute paths to existing files. In brief, the available features
# are as follows, with paths searched for in relation to the folder of
# the ''about.yaml'' file.
#
#   + ''/hard/coded/path/one/file'' indicates a specific file.
#   + ''/hard/coded/path/about/subfolder'' indicates a specific folder
#     containing a new ''about.yaml'' file to be analyzed.
#   + ''glob: ...'' allows to use the glob syntax, and for a recursive
#     search, there is ''r-glob: ...''.
#   + ''regex: ...'' allows to use regex patterns, and ''r-regex: ...''
#     is available for recursive searches.
###
toc*: list(tocpath) > map_toc
