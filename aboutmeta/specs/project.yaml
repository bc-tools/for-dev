###
# This block is used to describe a project from a technical point
# of view.
###
project*:
###
# This is the current version number of the project.
###
  version*: version
###
# This is the date of the current version of the project.
###
  date*: date

###
# These data help explains the meaning of the acronym used to name
# the project.
###
  acronym*: str
###
# {codename}
# This value, optional for a code-type project, allows to name the
# project differently from the folder containing it.
#
# {doctitle}
# This value is mandatory for a “document” type project: it gives
# the title of the document.
###
  codename | doctitle *: . | .
###
# Who am I?
###
  desc: .

###
# {author}
# Who am I?
#
# {authors}
# Who am I?
###
  author | authors *: person | list(.)

###
# {contrib}
# Who am I?
#
# {contribs}
# Who am I?
###
  contrib | contribs *: . | list(.)

###
# Who am I?
###
  urls*:
    home*  : url
    dev*   : .
    issues*: .

###
# Who am I?
###
  licenses*:
    code*  : license
    manual*: .

###
# Who am I?
###
  langs*:
    doc*   : lang
    manual*: .

###
# Who am I?
###
  require*: list(str)

###
# Who am I?
###
  keywords*: list(.)
